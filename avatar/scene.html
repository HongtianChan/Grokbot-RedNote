<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>Grokbot-RedNote</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      -webkit-app-region: drag;
    }
    #world {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      padding: 42px 10px 18px;
      box-sizing: border-box;
      min-height: 0;
      -webkit-app-region: drag;
    }
    #mid {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      display: grid;
      grid-template-columns: minmax(84px, 1fr) auto minmax(84px, 1fr);
      gap: 8px;
      align-items: stretch;
      -webkit-app-region: drag;
    }
    #center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 0;
      -webkit-app-region: drag;
    }
    #stage-area, #actor-slot, #actor-motion, #avatar, #status, #hat, #path {
      -webkit-app-region: drag;
    }
    #stage-area {
      position: relative;
      width: 132px;
      height: 148px;
      flex: 0 0 148px;
    }
    #actor-slot {
      position: absolute;
      left: 50%;
      top: 0;
      width: 200px;
      height: 200px;
      margin-left: -100px;
      transform: scale(0.66);
      transform-origin: top center;
    }
    #path {
      position: absolute;
      left: 50%;
      top: 198px;
      width: 108px;
      height: 2px;
      margin-left: -54px;
      border-radius: 1px;
      background: linear-gradient(to right, rgba(243, 244, 246, 0.06), rgba(243, 244, 246, 0.7), rgba(243, 244, 246, 0.06));
      opacity: 0;
      transform: scaleX(0.4);
      transition: opacity 0.25s ease, transform 0.3s ease;
      pointer-events: none;
    }
    #path.on {
      opacity: 1;
      transform: scaleX(1);
    }
    #actor-motion {
      width: 100%;
      height: 100%;
      position: relative;
      transform-origin: 50% 85%;
    }
    #actor-motion.idle-loop {
      animation: idle-bob 4s cubic-bezier(0.618, 0.001, 0.184, 0.936) infinite;
    }
    #actor-motion.shake { animation: dust-shake 0.55s ease-out; }
    #actor-motion.happy { animation: happy-bounce 0.45s ease-out; }
    @keyframes idle-bob {
      0%, 100% { transform: translateY(0) scale(1); }
      40% { transform: translateY(-5px) scale(1.067); }
    }
    @keyframes dust-shake {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      16% { transform: translate(-4px, 1px) rotate(-3deg); }
      32% { transform: translate(5px, -1px) rotate(3deg); }
      48% { transform: translate(-3px, 2px) rotate(-2deg); }
      64% { transform: translate(3px, 0) rotate(2deg); }
      80% { transform: translate(-2px, 1px) rotate(-1deg); }
    }
    @keyframes happy-bounce {
      0% { transform: translateY(0); }
      40% { transform: translateY(-8px); }
      100% { transform: translateY(0); }
    }
    #avatar {
      position: absolute;
      inset: 0;
      width: 200px;
      height: 200px;
    }
    #hat {
      position: absolute;
      left: 22%;
      top: -6%;
      width: 56%;
      pointer-events: none;
      opacity: 0;
      transform: translateY(-28px) rotate(-8deg);
      transition: opacity 0.28s ease, transform 0.35s cubic-bezier(0.2, 1.1, 0.3, 1);
      z-index: 3;
    }
    #hat.on {
      opacity: 1;
      transform: translateY(0) rotate(0deg);
    }
    #hat svg { display: block; width: 100%; height: auto; }
    #status {
      margin-top: 4px;
      min-height: 1.2em;
      max-width: 132px;
      font: 11px/1.35 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", sans-serif;
      color: #f3f4f6;
      letter-spacing: 0.04em;
      text-align: center;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    #status.on { opacity: 0.92; }
    #status.steady::after { display: none; content: none; animation: none; }
    #tears {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      opacity: 0;
    }
    #actor-slot.crying #tears { opacity: 1; }
    .tear {
      position: absolute;
      width: 9px;
      height: 9px;
      background: #8fd0ff;
      border-radius: 0 50% 50% 50%;
      transform: rotate(45deg);
      opacity: 0;
    }
    .tear-left { left: 38%; top: 46%; }
    .tear-right { left: 56%; top: 48%; }
    #actor-slot.crying .tear-left {
      animation: tear-drip 1.6s ease-in infinite;
    }
    #actor-slot.crying .tear-right {
      animation: tear-drip 1.6s ease-in 0.7s infinite;
    }
    #actor-slot.crying #actor-motion {
      animation: cry-bob 2.4s ease-in-out infinite;
    }
    @keyframes tear-drip {
      0% { opacity: 0; transform: rotate(45deg) translate(0, 0); }
      18% { opacity: 0.95; }
      100% { opacity: 0; transform: rotate(45deg) translate(8px, 26px); }
    }
    @keyframes cry-bob {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(3px) rotate(2deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      #actor-slot.crying #actor-motion { animation: none; }
      #actor-slot.crying .tear {
        animation: none;
        opacity: 0.85;
        transform: rotate(45deg);
      }
    }
    #status.on::after {
      content: "";
      display: inline-block;
      width: 1.35em;
      margin-left: 0.02em;
      text-align: left;
      animation: status-ellipsis 1.2s steps(4, end) infinite;
    }
    @keyframes status-ellipsis {
      0% { content: ""; }
      25% { content: "."; }
      50% { content: ".."; }
      75%, 100% { content: "..."; }
    }

    .rail {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: hidden;
      -webkit-app-region: no-drag;
      color: #f4f4f5;
      font: 12px/1.4 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", sans-serif;
      -webkit-user-select: text;
      user-select: text;
      pointer-events: auto;
    }
    .rail section {
      flex: 0 0 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .rail section.is-open {
      flex: 1 1 0;
      min-height: 88px;
    }

    .fold-toggle {
      appearance: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      box-sizing: border-box;
      border: 0;
      border-radius: 10px;
      padding: 8px 9px;
      background: rgba(244, 244, 245, 0.07);
      color: rgba(244, 244, 245, 0.9);
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
      text-align: left;
      -webkit-app-region: no-drag;
    }
    .fold-toggle:hover { background: rgba(244, 244, 245, 0.12); }
    .fold-toggle::after {
      content: "";
      width: 6px;
      height: 6px;
      margin-left: 6px;
      flex: 0 0 auto;
      border-right: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor;
      transform: rotate(45deg);
      opacity: 0.7;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .fold-toggle[aria-expanded="true"]::after { transform: rotate(225deg); }
    .fold {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      transition: grid-template-rows 0.34s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 0.26s ease;
      pointer-events: none;
      min-height: 0;
    }
    .fold.open {
      grid-template-rows: 1fr;
      opacity: 1;
      pointer-events: auto;
      flex: 1 1 auto;
    }
    .fold-inner {
      overflow: hidden;
      min-height: 0;
    }
    section.is-open .fold.open .fold-inner {
      overflow: auto;
      margin-top: 6px;
    }

    .toolbar {
      display: flex;
      justify-content: flex-end;
      margin: 0 0 8px;
    }
    .clear-btn {
      appearance: none;
      border: 0;
      background: rgba(244, 244, 245, 0.1);
      color: #f4f4f5;
      border-radius: 999px;
      padding: 5px 11px;
      cursor: pointer;
      font-size: 11px;
      -webkit-app-region: no-drag;
    }
    .clear-btn:hover { background: rgba(244, 244, 245, 0.16); }
    .clear-btn:disabled { opacity: 0.45; cursor: default; }

    .note-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .note-list a,
    .note-list .note-fallback {
      display: block;
      padding: 7px 8px;
      border-radius: 10px;
      color: inherit;
      text-decoration: none;
      background: rgba(244, 244, 245, 0.07);
      -webkit-app-region: no-drag;
    }
    .note-list a:hover { background: rgba(244, 244, 245, 0.13); }
    .note-title {
      display: block;
      font-size: 12px;
      font-weight: 560;
      letter-spacing: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .note-meta {
      display: block;
      margin-top: 2px;
      font-size: 10.5px;
      color: rgba(244, 244, 245, 0.62);
      letter-spacing: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hint, #records-empty, #records-status, #results-status {
      margin: 4px 0 8px;
      font-size: 11px;
      opacity: 0.75;
      text-align: center;
    }
    #records-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .record-query {
      margin: 0 0 2px;
      font-size: 12px;
      font-weight: 560;
    }
    .record-meta {
      margin: 0 0 6px;
      font-size: 10.5px;
      color: rgba(244, 244, 245, 0.62);
    }

    #load-saved { display: none; }
    #load-saved.show { display: inline-block; }
    .toolbar { gap: 6px; }

    .rail, .fold-inner, #all-list, #curated-list, #records-list {
      scrollbar-width: thin;
      scrollbar-color: rgba(244, 244, 245, 0.28) transparent;
    }
    .fold-inner::-webkit-scrollbar { width: 6px; }
    .fold-inner::-webkit-scrollbar-thumb {
      background: rgba(244, 244, 245, 0.28);
      border-radius: 99px;
    }
    button, a, input, textarea, select { -webkit-app-region: no-drag; }
    #live, #stage { display: none; }
  </style>
</head>
<body>
  <div id="world">
    <div id="mid">
      <aside id="rail-left" class="rail">
        <section id="curated">
          <button type="button" id="curated-toggle" class="fold-toggle" aria-expanded="false">
            <span id="curated-toggle-label">精选</span>
          </button>
          <div id="curated-fold" class="fold">
            <div class="fold-inner">
              <ol id="curated-list" class="note-list"></ol>
            </div>
          </div>
        </section>
        <section id="records-panel">
          <button type="button" id="records-toggle" class="fold-toggle" aria-expanded="false">
            <span id="records-toggle-label">搜索记录</span>
          </button>
          <div id="records-fold" class="fold">
            <div class="fold-inner">
              <div class="toolbar">
                <button type="button" id="clear-records" class="clear-btn">清空记录</button>
              </div>
              <p id="records-empty" hidden>暂无搜索记录</p>
              <p id="records-status" hidden></p>
              <ol id="records-list"></ol>
            </div>
          </div>
        </section>
      </aside>
      <div id="center">
        <div id="stage-area">
          <div id="path" aria-hidden="true"></div>
          <div id="actor-slot">
            <div id="actor-motion">
              <div id="avatar"></div>
              <div id="tears" aria-hidden="true">
                <span class="tear tear-left"></span>
                <span class="tear tear-right"></span>
              </div>
              <div id="hat" aria-hidden="true">
                <svg viewBox="0 0 120 72" xmlns="http://www.w3.org/2000/svg">
                  <ellipse cx="60" cy="54" rx="54" ry="9" fill="#e0a82e"/>
                  <path d="M20 50C22 16 98 16 100 50Z" fill="#f0c14b"/>
                  <rect x="54" y="14" width="12" height="36" rx="5" fill="#d39420"/>
                  <ellipse cx="60" cy="18" rx="8" ry="4" fill="#f6d36a"/>
                </svg>
              </div>
            </div>
          </div>
        </div>
        <div id="status" aria-live="polite"></div>
      </div>
      <aside id="rail-right" class="rail">
        <section id="all-results">
          <button type="button" id="all-toggle" class="fold-toggle" aria-expanded="false">
            <span id="all-toggle-label">全部结果</span>
          </button>
          <div id="all-fold" class="fold">
            <div class="fold-inner">
              <div class="toolbar">
                <button type="button" id="load-saved" class="clear-btn">已保存</button>
                <button type="button" id="clear-results" class="clear-btn">清空结果</button>
              </div>
              <p id="results-status" hidden></p>
              <ol id="all-list" class="note-list"></ol>
            </div>
          </div>
        </section>
      </aside>
    </div>
  </div>
  <div id="live"></div>
  <div id="stage"></div>
  <script type="module" src="bridge.js"></script>
  <script type="module" src="scene.js"></script>
</body>
</html>
