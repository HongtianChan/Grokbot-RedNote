<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>Grokbot-RedNote</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }
    #world {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 48px 16px 16px;
      box-sizing: border-box;
    }
    body:not(.has-results) #world {
      justify-content: center;
      padding: 56px 24px 36px;
    }
    #stage-area {
      position: relative;
      width: 200px;
      height: 220px;
      flex: 0 0 220px;
    }
    body.has-results #stage-area {
      transform: scale(0.72);
      transform-origin: top center;
      height: 158px;
      flex: 0 0 158px;
      margin-bottom: 0;
    }
    #path {
      position: absolute;
      left: 50%;
      top: 198px;
      width: 108px;
      height: 2px;
      margin-left: -54px;
      border-radius: 1px;
      background: linear-gradient(to right, rgba(243, 244, 246, 0.06), rgba(243, 244, 246, 0.7), rgba(243, 244, 246, 0.06));
      opacity: 0;
      transform: scaleX(0.4);
      transition: opacity 0.25s ease, transform 0.3s ease;
      pointer-events: none;
    }
    #path.on {
      opacity: 1;
      transform: scaleX(1);
    }
    #actor-slot {
      position: absolute;
      left: 0;
      top: 0;
      width: 200px;
      height: 200px;
    }
    #actor-motion {
      width: 100%;
      height: 100%;
      position: relative;
      transform-origin: 50% 85%;
    }
    #actor-motion.idle-loop {
      animation: idle-bob 4s cubic-bezier(0.618, 0.001, 0.184, 0.936) infinite;
    }
    #actor-motion.shake {
      animation: dust-shake 0.55s ease-out;
    }
    #actor-motion.happy {
      animation: happy-bounce 0.45s ease-out;
    }
    @keyframes idle-bob {
      0%, 100% { transform: translateY(0) scale(1); }
      40% { transform: translateY(-5px) scale(1.067); }
    }
    @keyframes dust-shake {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      16% { transform: translate(-4px, 1px) rotate(-3deg); }
      32% { transform: translate(5px, -1px) rotate(3deg); }
      48% { transform: translate(-3px, 2px) rotate(-2deg); }
      64% { transform: translate(3px, 0) rotate(2deg); }
      80% { transform: translate(-2px, 1px) rotate(-1deg); }
    }
    @keyframes happy-bounce {
      0% { transform: translateY(0); }
      40% { transform: translateY(-8px); }
      100% { transform: translateY(0); }
    }
    #avatar {
      position: absolute;
      inset: 0;
      width: 200px;
      height: 200px;
    }
    #hat {
      position: absolute;
      left: 22%;
      top: -6%;
      width: 56%;
      pointer-events: none;
      opacity: 0;
      transform: translateY(-28px) rotate(-8deg);
      transition: opacity 0.28s ease, transform 0.35s cubic-bezier(0.2, 1.1, 0.3, 1);
      z-index: 3;
    }
    #hat.on {
      opacity: 1;
      transform: translateY(0) rotate(0deg);
    }
    #hat svg { display: block; width: 100%; height: auto; }
    #status {
      margin-top: 8px;
      min-height: 1.25em;
      font: 13px/1.35 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", sans-serif;
      color: #f3f4f6;
      letter-spacing: 0.06em;
      text-align: center;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    #status.on { opacity: 0.92; }
    /* Cycling ellipsis beside the busy label; the avatar itself uses
       official `thinking` (dots morph) for the same "still working" beat. */
    #status.on::after {
      content: "";
      display: inline-block;
      width: 1.35em;
      margin-left: 0.02em;
      text-align: left;
      animation: status-ellipsis 1.2s steps(4, end) infinite;
    }
    @keyframes status-ellipsis {
      0% { content: ""; }
      25% { content: "."; }
      50% { content: ".."; }
      75%, 100% { content: "..."; }
    }

    #results {
      display: none;
      width: min(100%, 360px);
      flex: 1 1 auto;
      min-height: 0;
      margin-top: 8px;
      color: #f3f4f6;
      font: 12px/1.4 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", sans-serif;
      -webkit-user-select: text;
      user-select: text;
      pointer-events: auto;
      flex-direction: column;
      gap: 10px;
      overflow: auto;
    }
    body.has-results #results { display: flex; }
    #results h2 {
      margin: 0 0 6px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: none;
      opacity: 0.7;
    }
    #curated { flex: 0 0 auto; }
    #all-results {
      flex: 0 0 auto;
    }
    .note-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .note-list a {
      display: block;
      padding: 7px 8px;
      border-radius: 8px;
      color: inherit;
      text-decoration: none;
      background: rgba(243, 244, 246, 0.06);
    }
    .note-list a:hover { background: rgba(243, 244, 246, 0.12); }
    .note-title {
      display: block;
      font-size: 12px;
      font-weight: 550;
      letter-spacing: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .note-meta {
      display: block;
      margin-top: 2px;
      font-size: 11px;
      opacity: 0.7;
      letter-spacing: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #results-empty, #load-saved {
      margin: 8px 0 0;
      font-size: 12px;
      letter-spacing: 0;
      opacity: 0.75;
      text-align: center;
    }
    #load-saved {
      display: none;
      appearance: none;
      border: 0;
      background: rgba(243, 244, 246, 0.1);
      color: #f3f4f6;
      border-radius: 999px;
      padding: 6px 12px;
      cursor: pointer;
    }
    #load-saved.show { display: inline-block; }
    #load-saved:hover { background: rgba(243, 244, 246, 0.16); }
    #live, #stage { display: none; }
  </style>
</head>
<body>
  <div id="world">
    <div id="stage-area">
      <div id="path" aria-hidden="true"></div>
      <div id="actor-slot">
        <div id="actor-motion">
          <div id="avatar"></div>
          <div id="hat" aria-hidden="true">
            <svg viewBox="0 0 120 72" xmlns="http://www.w3.org/2000/svg">
              <ellipse cx="60" cy="54" rx="54" ry="9" fill="#e0a82e"/>
              <path d="M20 50C22 16 98 16 100 50Z" fill="#f0c14b"/>
              <rect x="54" y="14" width="12" height="36" rx="5" fill="#d39420"/>
              <ellipse cx="60" cy="18" rx="8" ry="4" fill="#f6d36a"/>
            </svg>
          </div>
        </div>
      </div>
    </div>
    <div id="status" aria-live="polite"></div>
    <div id="results">
      <section id="curated">
        <h2 id="curated-heading">精选</h2>
        <ol id="curated-list" class="note-list"></ol>
      </section>
      <section id="all-results">
        <h2 id="all-heading">全部结果</h2>
        <ol id="all-list" class="note-list"></ol>
      </section>
    </div>
    <p id="results-empty" hidden>搜索完成后，精选笔记会显示在这里</p>
    <button type="button" id="load-saved">查看已保存的钩子搜索</button>
  </div>
  <div id="live"></div>
  <div id="stage"></div>
  <script type="module" src="bridge.js"></script>
  <script type="module" src="scene.js"></script>
</body>
</html>
